$font = FiraCode Nerd Font Mono

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
    animation = inputFieldColors, 0, 0, linear
}

background {
    color = rgb(40, 40, 40)  # {< replace_rgb(colors.bg) >}
}

input-field {
    monitor = eDP-1
    size = 600, 70
    outline_thickness = 0
    inner_color = rgba(00000000)
    check_color = rgba(00000000)
    fail_color = rgba(00000000)
    font_color = rgb(251, 241, 199)  # {< replace_rgb(colors.fg) >}
    fade_on_empty = false
    font_family = $font
    placeholder_text = Locked
    fail_text = $PAMFAIL$FPRINTFAIL

    check_text = Checking
    dots_spacing = 0.3
}
