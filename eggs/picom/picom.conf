# General
backend = "glx";
blur: {
  method = "dual_kawase";
  strength = 5;
}
vsync = true;

# Rule-based per-window options.
rules: ({
  match = "(window_type = 'normal' || window_type = 'notification') && "
          "window_type != 'dock'                                    && "
          "!fullscreen";
  corner-radius = 12;
  shadow = true;
}, {
  match = "window_type = 'normal' && "
          "window_type != 'dock'  && "
          "!focused               && "
          "class_g != 'Rofi'      && "
          "class_g != 'i3lock'";
  opacity = 0.7;
})
