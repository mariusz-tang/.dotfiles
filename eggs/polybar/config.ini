[colors]
transparent = #0000
foreground = #eed
primary = #caf

[settings]
screenchange-reload = true

[bar/base]
monitor = ${env:MONITOR}

background = ${colors.transparent}
foreground = ${colors.foreground}

line-size = 2pt
separator = " "

font-0 = FiraCode Nerd Font Mono:size=12:weight=medium;2
font-1 = VL PGothic:size=12:weight=medium;2

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[bar/main]
inherit = bar/base

modules-left = workspaces xwindow
modules-center = time date
modules-right = spotify battery


[module/workspaces]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = true

format = <label-state>

label-focused = %name%
label-focused-overline = ${colors.primary}
label-focused-foreground = ${colors.primary}
label-focused-padding = 1

label-unfocused = %name%
label-unfocused-padding = 1

label-urgent = %name%
label-urgent-padding = 1

label-empty = %name%
label-empty-padding = 1

label-visible = %name%
label-visible-overline = ${colors.primary}
label-visible-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:50:...%
label-empty = "Desktop"

format-background = ${colors.background}
format-prefix = ""

[module/battery]
type = internal/battery
low-at = 20

battery = BAT1
adapter = ACAD

format-full = ""
format-charging = ""
format-discharging = <animation-discharging><label-discharging>
format-low = <animation-low>

animation-discharging-0 = " "
animation-discharging-1 = " "
animation-discharging-2 = " "
animation-discharging-3 = " "
animation-discharging-4 = " "
animation-discharging-framerate = 500
label-discharging = "%percentage%% "

animation-low-0 = "  LOW "
animation-low-0-background = ${colors.red}
animation-low-1 = "  LOW "
animation-low-framerate = 500

[time-base]
type = internal/date
interval = 1

[module/time]
inherit = time-base
label = %time%
time = %H:%M
time-alt = %H:%M:%S
format-prefix = "  "

[module/date]
inherit = time-base
label = "%date% "
date = %a %d
date-alt = %A %d %B %Y
format-prefix = " 󰃭 "

[module/spotify]
type = custom/script
interval = 1
format-prefix = " "
format-suffix = " "
format-background = ${colors.background}
format = <label>
exec = python ~/.config/polybar/spotify-status --format '{artist}: {song}' --trunclen 30
click-left = playerctl --player=spotify play-pause
click-right = playerctl --player=spotify next
click-middle = playerctl --player=spotify previous
